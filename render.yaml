services:
  - type: web
    name: rsshub
    env: docker
    repo: https://github.com/kingopenr010077/RSSHub
    branch: master
    docker:
      image: diygod/rsshub
    dockerCommand: npm run start
    healthCheckPath: /healthz
    domains:
      - rss.showcase.ccwu.cc
    envVars:
      - key: NODE_ENV
        value: production
      - key: CACHE_TYPE
        value: memory
      - key: CACHE_EXPIRE
        value: 300
      - key: TZ
        value: Asia/Shanghai
      - key: CORS_ALLOW_ORIGIN
        value: "*"
