name: Deploy to Cloudflare Workers

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build Worker
        run: pnpm run worker-build
        env:
          WORKER_ROUTES: "deepseek,openai,anthropic,claude,aibase,huggingface,langchain,36kr,huxiu,ithome,geekpark,leiphone,hackernews,github,theverge,techcrunch,reuters,bloomberg,wired,nytimes,bbc,weibo,twitter,bilibili,zhihu,youtube,medium,ifanr,cnbeta"

      - name: Deploy to Cloudflare Workers
        run: npx wrangler@latest deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
